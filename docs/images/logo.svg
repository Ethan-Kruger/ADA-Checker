<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="ADA Checker logo">
  <title>ADA Checker</title>
  <!-- Background circle -->
  <circle cx="20" cy="20" r="20" fill="#4f4fbf"/>
  <!-- Head -->
  <circle cx="20" cy="10.5" r="3.5" fill="white"/>
  <!-- Torso -->
  <line x1="20" y1="14.5" x2="20" y2="26" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Arms spread -->
  <line x1="11" y1="20" x2="29" y2="20" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="20" y1="26" x2="14" y2="35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="20" y1="26" x2="26" y2="35" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
</svg>
