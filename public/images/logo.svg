<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" role="img" aria-label="ADA Checker logo">
  <title>ADA Checker</title>
  <!-- Background circle -->
  <circle cx="20" cy="20" r="20" fill="#4f4fbf"/>
  <!-- Head -->
  <circle cx="20" cy="8.5" r="3" fill="white"/>
  <!-- Torso -->
  <line x1="20" y1="12" x2="20" y2="22" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Arms spread -->
  <line x1="12" y1="16.5" x2="28" y2="16.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Left leg -->
  <line x1="20" y1="22" x2="14.5" y2="28.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- Right leg -->
  <line x1="20" y1="22" x2="25.5" y2="28.5" stroke="white" stroke-width="2.2" stroke-linecap="round"/>
  <!-- ADA text -->
  <text x="20" y="37.5" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif"
        font-size="8.5" font-weight="bold" fill="white" letter-spacing="1">ADA</text>
</svg>
