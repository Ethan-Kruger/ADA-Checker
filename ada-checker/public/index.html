<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Checker</title>
</head>
<body>
  <h1>ADA Checker</h1>
  <form action="/check" method="POST">
    <label for="url">Enter URL to check:</label><br>
    <textarea id="url" name="url" rows="3" cols="60" placeholder="https://example.com"></textarea><br>
    <button type="button" onclick="alert('Check Accessibility button pushed!')">Check Accessibility</button>
  </form>
</body>
</html>
