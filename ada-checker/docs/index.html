<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ADA Checker</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <h1>ADA Checker</h1>
  <label for="html-input">Paste HTML to check:</label><br>
  <textarea id="html-input" rows="10" cols="60" placeholder="<img src='photo.png'>"></textarea><br>
  <button type="button" id="check-btn">Check Accessibility</button>
  <div id="results"></div>
  <script>
    document.getElementById('check-btn').addEventListener('click', async () => {
      const html = document.getElementById('html-input').value;
      const res = await fetch('/api/check', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ html })
      });
      const data = await res.json();
      const resultsEl = document.getElementById('results');
      const count = data.results.length;
      let output = `<p>Found ${count} problem${count !== 1 ? 's' : ''}.</p>`;
      data.results.forEach(r => {
        output += `<div class="violation severity-${r.severity}">
          <p><strong>${r.severity.toUpperCase()}:</strong> ${r.message}</p>
          <p>Element: <span class="element">${r.element.replace(/</g, '&lt;').replace(/>/g, '&gt;')}</span></p>
          <p>Remediation: ${r.remediation}</p>
        </div>`;
      });
      resultsEl.innerHTML = output;
    });
  </script>
</body>
</html>
