name: Accessibility check

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '0 6 * * *'   # every day at 6 AM UTC
  workflow_dispatch:

jobs:
  a11y:
    name: WCAG scan
    runs-on: ubuntu-latest

    permissions:
      issues: write
      contents: read

    steps:
      - uses: actions/checkout@v6.0.2

      - uses: actions/setup-node@v6.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run accessibility gate
        id: a11y
        continue-on-error: true
        run: |
          node scripts/ci-check.mjs \
            --all \
            --threshold 80 \
            --level AA \
            --json a11y-violations.json

      - name: Create issues for violations
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node scripts/create-a11y-issues.mjs a11y-violations.json

      - name: Fail if accessibility gate failed
        if: steps.a11y.outcome == 'failure'
        run: exit 1
