name: Move referenced issues to In Progress

on:
  pull_request:
    types: [opened, reopened, edited]
  issues:
    types: [assigned]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to move to In Progress'
        required: true
        type: number

permissions: {}

jobs:
  move-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Move issues to In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId        = 'PVT_kwHOBcIEls4BTdr7';
            const statusFieldId    = 'PVTSSF_lAHOBcIEls4BTdr7zhAspmY';
            const inProgressOption = '47fc9ee4';

            async function moveToInProgress(issueNumber) {
              console.log(`Moving issue #${issueNumber} to In Progress...`);

              let issueNodeId;
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: issueNumber,
                });
                issueNodeId = issue.data.node_id;
              } catch (e) {
                console.error(`Could not fetch issue #${issueNumber}:`, e.message);
                return;
              }

              // Add to project (idempotent — returns existing item if already added)
              const addResult = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId, contentId: issueNodeId });

              const itemId = addResult.addProjectV2ItemById.item.id;

              // Set status field to In Progress
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId:    $itemId,
                    fieldId:   $fieldId,
                    value:     { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, { projectId, itemId, fieldId: statusFieldId, optionId: inProgressOption });

              console.log(`✓ Issue #${issueNumber} moved to In Progress.`);
            }

            // ── Manual trigger ────────────────────────────────────────────────
            if (context.eventName === 'workflow_dispatch') {
              await moveToInProgress(Number(context.payload.inputs.issue_number));
              return;
            }

            // ── Issue assigned ────────────────────────────────────────────────
            if (context.eventName === 'issues') {
              await moveToInProgress(context.payload.issue.number);
              return;
            }

            // ── Pull request opened / reopened / edited ───────────────────────
            const pr = context.payload.pull_request;
            const text = `${pr.title}\n${pr.body || ''}`;

            // Match: fixes #50, closes #50, resolves #50 (and past/present tense)
            const pattern = /(?:fix(?:es|ed)?|close[sd]?|resolve[sd]?)\s+#(\d+)/gi;
            const numbers = [...new Set([...text.matchAll(pattern)].map(m => parseInt(m[1])))];

            if (numbers.length === 0) {
              console.log('No referenced issues found in PR title or body.');
              return;
            }

            console.log('Found referenced issues:', numbers);
            for (const n of numbers) await moveToInProgress(n);
