name: Move referenced issues to In Progress

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, reopened, edited]
  issues:
    types: [assigned]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Issue number to move to In Progress'
        required: true
        type: number

permissions: {}

jobs:
  move-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Move issues to In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const projectId        = 'PVT_kwHOBcIEls4BTdr7';
            const statusFieldId    = 'PVTSSF_lAHOBcIEls4BTdr7zhAspmY';
            const inProgressOption = '47fc9ee4';

            async function moveToInProgress(issueNumber) {
              // Verify the issue actually exists and is open
              let issueNodeId;
              try {
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo:  context.repo.repo,
                  issue_number: issueNumber,
                });
                if (issue.data.state !== 'open') {
                  console.log(`Issue #${issueNumber} is ${issue.data.state} — skipping.`);
                  return;
                }
                issueNodeId = issue.data.node_id;
              } catch (e) {
                console.log(`Issue #${issueNumber} not found — skipping.`);
                return;
              }

              // Add to project (idempotent)
              const addResult = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId, contentId: issueNodeId });

              const itemId = addResult.addProjectV2ItemById.item.id;

              // Set status to In Progress
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId:    $itemId,
                    fieldId:   $fieldId,
                    value:     { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, { projectId, itemId, fieldId: statusFieldId, optionId: inProgressOption });

              console.log(`✓ Issue #${issueNumber} moved to In Progress.`);
            }

            function extractIssueNumbers(text) {
              // Match #123 anywhere in the text
              const matches = [...text.matchAll(/#(\d+)/g)];
              return [...new Set(matches.map(m => parseInt(m[1])))];
            }

            // ── Manual trigger ──────────────────────────────────────────────
            if (context.eventName === 'workflow_dispatch') {
              await moveToInProgress(Number(context.payload.inputs.issue_number));
              return;
            }

            // ── Issue assigned ──────────────────────────────────────────────
            if (context.eventName === 'issues') {
              await moveToInProgress(context.payload.issue.number);
              return;
            }

            // ── Pull request ────────────────────────────────────────────────
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const numbers = extractIssueNumbers(`${pr.title}\n${pr.body || ''}`);
              if (numbers.length === 0) {
                console.log('No issue references found in PR.');
                return;
              }
              for (const n of numbers) await moveToInProgress(n);
              return;
            }

            // ── Push — scan all commit messages in the push ─────────────────
            if (context.eventName === 'push') {
              const commits = context.payload.commits || [];
              const allText = commits.map(c => c.message).join('\n');
              const numbers = extractIssueNumbers(allText);
              if (numbers.length === 0) {
                console.log('No issue references found in commit messages.');
                return;
              }
              console.log('Found issue references in commits:', numbers);
              for (const n of numbers) await moveToInProgress(n);
            }
