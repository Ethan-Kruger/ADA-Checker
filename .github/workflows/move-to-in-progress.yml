name: Move referenced issues to In Progress

on:
  pull_request:
    types: [opened, reopened]

permissions: {}

jobs:
  move-issues:
    runs-on: ubuntu-latest
    permissions:
      issues: write

    steps:
      - name: Move referenced issues to In Progress
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}
          script: |
            const body = context.payload.pull_request.body || '';

            // Match: fix #50, fixes #50, fixed #50, closes #50, close #50, closed #50, resolves #50, resolve #50, resolved #50
            const pattern = /(?:fix(?:es|ed)?|close[sd]?|resolve[sd]?)\s+#(\d+)/gi;
            const matches = [...body.matchAll(pattern)];
            const issueNumbers = [...new Set(matches.map(m => parseInt(m[1])))];

            if (issueNumbers.length === 0) {
              console.log('No referenced issues found in PR body.');
              return;
            }

            console.log('Referenced issues:', issueNumbers);

            const projectId = 'PVT_kwHOBcIEls4BTdr7';
            const statusFieldId = 'PVTSSF_lAHOBcIEls4BTdr7zhAspmY';
            const inProgressOptionId = '47fc9ee4';

            for (const issueNumber of issueNumbers) {
              // Get the issue node ID
              const issue = await github.rest.issues.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber
              });
              const issueNodeId = issue.data.node_id;
              console.log(`Processing issue #${issueNumber} (${issueNodeId})`);

              // Add issue to project (or get existing item ID)
              const addResult = await github.graphql(`
                mutation($projectId: ID!, $contentId: ID!) {
                  addProjectV2ItemById(input: { projectId: $projectId, contentId: $contentId }) {
                    item { id }
                  }
                }
              `, { projectId, contentId: issueNodeId });

              const itemId = addResult.addProjectV2ItemById.item.id;

              // Set status to In Progress
              await github.graphql(`
                mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                  updateProjectV2ItemFieldValue(input: {
                    projectId: $projectId,
                    itemId: $itemId,
                    fieldId: $fieldId,
                    value: { singleSelectOptionId: $optionId }
                  }) {
                    projectV2Item { id }
                  }
                }
              `, { projectId, itemId, fieldId: statusFieldId, optionId: inProgressOptionId });

              console.log(`Issue #${issueNumber} moved to In Progress.`);
            }
