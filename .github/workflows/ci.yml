name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # ===== Java build & tests (pick one: Maven or Gradle) =====

      # If you use Maven, keep this and delete the Gradle step below
      - name: Build with Maven
        run: mvn -B verify

      # If you use Gradle instead of Maven, use this and delete the Maven step
      # - name: Build with Gradle
      #   run: ./gradlew build

      # ===== HTML/CSS/JS linting (optional examples) =====

      # Example: HTMLHint (for HTML)
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint

      - name: Lint HTML files
        run: |
          htmlhint "**/*.html" || exit 1

      - name: Lint CSS files
        run: |
          stylelint "**/*.css" || exit 1
