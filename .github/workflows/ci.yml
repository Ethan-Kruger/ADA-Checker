name: CI

on:
  push:
    branches: [ claude/create-ada-checker-folder-pryLX ]
  pull_request:
    branches: [ claude/create-ada-checker-folder-pryLX ]
    
permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: |
          npm install -g htmlhint 

      - name: Lint HTML files in docs
        run: |
          htmlhint "docs/**/*.html" || exit 1

      
        
          
        
