name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # If you ever add Java later, we can add Java steps here.

      # Optional: HTML/CSS linting for files in docs/
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install linters
        run: |
          npm install -g htmlhint stylelint

      - name: Lint HTML files in docs
        run: |
          htmlhint "docs/**/*.html" || exit 1

      - name: Lint CSS files in docs
        run: |
          stylelint "docs/**/*.css" || exit 1
